<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">Square knot reference</title>
  <desc id="desc">Illustration of left over right and right over left to finish a square knot.</desc>
  <rect width="640" height="360" rx="28" fill="#F6EFE2"/>
  <rect x="48" y="42" width="544" height="276" rx="24" fill="#FFF8EB" stroke="#D8C7A0" stroke-width="4"/>
  <text x="110" y="102" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#214C40">Left over right</text>
  <path d="M112 180h120" stroke="#214C40" stroke-width="18" stroke-linecap="round"/>
  <path d="M232 180c22-28 48-44 86-44" fill="none" stroke="#214C40" stroke-width="18" stroke-linecap="round"/>
  <text x="356" y="102" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#214C40">Right over left</text>
  <path d="M342 180h116" stroke="#214C40" stroke-width="18" stroke-linecap="round"/>
  <path d="M342 180c-22-28-48-44-86-44" fill="none" stroke="#214C40" stroke-width="18" stroke-linecap="round"/>
  <path d="M186 250c46-22 96-22 146 0 54 24 100 24 154 0" fill="none" stroke="#214C40" stroke-width="18" stroke-linecap="round"/>
  <text x="92" y="312" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#214C40">Use to join similar rope ends. Do not trust it for life-safety loads.</text>
</svg>
