<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">Bowline reference</title>
  <desc id="desc">Three-step bowline sequence showing the standing part, loop, and tail path.</desc>
  <rect width="640" height="360" rx="28" fill="#F6EFE2"/>
  <rect x="48" y="42" width="544" height="276" rx="24" fill="#FFF8EB" stroke="#D8C7A0" stroke-width="4"/>
  <text x="110" y="98" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#214C40">1. Make a small loop</text>
  <path d="M112 176h88c24 0 42-18 42-40s-18-40-42-40-42 18-42 40" fill="none" stroke="#214C40" stroke-width="16" stroke-linecap="round"/>
  <path d="M112 176h92" stroke="#214C40" stroke-width="16" stroke-linecap="round"/>
  <text x="300" y="98" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#214C40">2. Up through the loop</text>
  <path d="M328 182c-18-26-18-66 10-86 34-24 80-6 94 28" fill="none" stroke="#214C40" stroke-width="16" stroke-linecap="round"/>
  <path d="M320 222v-120" stroke="#214C40" stroke-width="16" stroke-linecap="round"/>
  <path d="M432 120l18 34-38-10" fill="none" stroke="#214C40" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="92" y="298" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#214C40">3. Around the standing part and back down through the loop.</text>
  <path d="M374 226c64-32 122-52 170-40" fill="none" stroke="#214C40" stroke-width="16" stroke-linecap="round"/>
  <path d="M310 250c26-10 44-38 40-68" fill="none" stroke="#214C40" stroke-width="16" stroke-linecap="round"/>
</svg>
