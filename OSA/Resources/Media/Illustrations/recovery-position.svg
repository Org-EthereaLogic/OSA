<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">Recovery position reminder</title>
  <desc id="desc">Illustration of a person rolled onto their side with head tilted and upper knee bent.</desc>
  <rect width="640" height="360" rx="28" fill="#F6EFE2"/>
  <rect x="48" y="42" width="544" height="276" rx="24" fill="#FFF8EB" stroke="#D8C7A0" stroke-width="4"/>
  <path d="M182 238c36-54 82-78 146-78 78 0 128 34 178 78" fill="none" stroke="#8B5A47" stroke-width="18" stroke-linecap="round"/>
  <circle cx="220" cy="162" r="34" fill="#E6C2AE" stroke="#8B5A47" stroke-width="4"/>
  <path d="M240 198c36 12 64 36 86 68" fill="none" stroke="#8B5A47" stroke-width="16" stroke-linecap="round"/>
  <path d="M318 206c34-8 72 4 106 40" fill="none" stroke="#8B5A47" stroke-width="16" stroke-linecap="round"/>
  <path d="M198 234c28 14 54 34 78 62" fill="none" stroke="#214C40" stroke-width="8" stroke-linecap="round"/>
  <text x="92" y="108" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#214C40">Roll onto the side. Tilt the head back. Bend the top knee.</text>
  <text x="92" y="312" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#214C40">Stop if breathing changes, vomiting starts, or spinal injury is a concern.</text>
</svg>
